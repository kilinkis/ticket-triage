[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ticket-triage"
version = "0.1.0"
description = "Support ticket triage pipeline built with LangChain LCEL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=1.7,<2",
    "langchain-openai>=1.7,<2",
    "python-dotenv>=1.0",
    "grandalf>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
